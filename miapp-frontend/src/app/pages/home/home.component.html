<div style="max-width: 500px; margin: 60px auto; padding: 24px; border: 1px solid #e0e0e0; border-radius: 8px; font-family: sans-serif;">
  <h2>Bienvenido, {{ user?.username }} 👋</h2>
  <p><strong>Correo:</strong> {{ user?.email }}</p>
  <p><strong>Rol Asignado:</strong> <span style="color: #007bff; font-weight: bold;">{{ user?.role }}</span></p>

  <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;" />

  <button (click)="onLogout()" style="padding: 10px 20px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
    Cerrar Sesión
  </button>
</div>
